<button #button class="cv-button" type="button" [attr.popovertarget]="menuId" aria-haspopup="menu">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
    <polyline points="7 10 12 15 17 10" />
    <line x1="12" y1="15" x2="12" y2="3" />
  </svg>
  <span>CV</span>
</button>
<div #menu class="cv-menu" [id]="menuId" popover role="menu" (toggle)="onToggle($event)">
  <a class="cv-menu-item" role="menuitem" [href]="paths.en" download (click)="close()">
    <app-flag lang="en" class="flag" />
    <span i18n="Header CV menu English@@headerCvEnglish">English</span>
  </a>
  <a class="cv-menu-item" role="menuitem" [href]="paths.fr" download (click)="close()">
    <app-flag lang="fr" class="flag" />
    <span i18n="Header CV menu French@@headerCvFrench">French</span>
  </a>
</div>
