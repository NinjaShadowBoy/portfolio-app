@if (routerLink(); as link) {
  <a [routerLink]="link" class="cta-button" [class]="'cta-' + variant()">
    <ng-container *ngTemplateOutlet="content" />
  </a>
} @else if (href(); as url) {
  <a [href]="url" [target]="target()" class="cta-button" [class]="'cta-' + variant()">
    <ng-container *ngTemplateOutlet="content" />
  </a>
} @else {
  <button class="cta-button" [class]="'cta-' + variant()">
    <ng-container *ngTemplateOutlet="content" />
  </button>
}

<ng-template #content>
  <span class="cta-text">{{ text() }}</span>
  <span class="cta-icon" [class]="'icon-' + icon()">
    <img [ngSrc]="iconSrc()" [alt]="iconAlt()" width="20" height="20" />
  </span>
</ng-template>
