<article class="project-card" [class.featured]="project().featured">
  <div class="card-media">
    @if (hasPhotos()) {
    <app-carousel [photoUrls]="project().photoUrls" [projectName]="project().name" />
    } @else {
    <div class="card-placeholder" aria-hidden="true">
      <span class="card-monogram">{{ monogram() }}</span>
    </div>
    }
    @if (project().featured && showFeaturedBadge()) {
    <span class="featured-badge" i18n="Project card featured badge@@projectCardFeatured">Featured</span>
    }
  </div>

  <div class="card-body">
    <h3 class="card-title">
      <a class="card-link" [routerLink]="['/projects', project().id]">{{ project().name }}</a>
    </h3>
    @if (description()) {
    <p class="card-description">{{ description() }}</p>
    }
    @if (project().technologies.length) {
    <app-tech-tags class="card-tags" variant="outline" [technologies]="project().technologies" />
    }
  </div>

  <footer class="card-footer">
    @if (hasLinks()) {
    <app-project-links [githubLink]="project().githubLink" [demoLink]="project().demoLink"
      [paperLink]="paper()" [projectName]="project().name" />
    } @else {
    <p class="no-links" i18n="Project without public links@@projectNoLinks">Code not public; walk-through on request</p>
    }
  </footer>
</article>
