<div
  class="segmented-toggle"
  role="radiogroup"
  [attr.aria-label]="ariaLabel() || null"
  [class.has-thumb]="thumbRect() !== null"
  [class.animate]="thumbReady()">
  @if (thumbRect(); as rect) {
    <span
      class="segmented-thumb"
      aria-hidden="true"
      [style.transform]="'translate(' + rect.x + 'px,' + rect.y + 'px)'"
      [style.width.px]="rect.w"
      [style.height.px]="rect.h"></span>
  }
  @for (option of options(); track option.value; let i = $index) {
    <button
      #btn
      type="button"
      role="radio"
      [attr.aria-checked]="option.value === selected()"
      [class.selected]="option.value === selected()"
      [tabindex]="tabIndexFor(i)"
      (click)="select(option.value)"
      [attr.aria-label]="option.shortLabel ? option.label : null"
      (keydown)="onKeydown($event, i)">
      @if (option.shortLabel) {
        <span class="label-full">{{ option.label }}</span>
        <span class="label-short" aria-hidden="true">{{ option.shortLabel }}</span>
      } @else {
        {{ option.label }}
      }
    </button>
  }
</div>
