@if (photoUrls().length > 0) {
  <div class="carousel-container" (mouseenter)="onHover()" (mouseleave)="onLeave()">
    <div class="carousel-main">
      <img 
        [src]="photoUrls()[currentImageIndex]" 
        [alt]="projectName() + ' screenshot ' + (currentImageIndex + 1)"
        class="carousel-image" />
    </div>
    
    @if (photoUrls().length > 1) {
      <button 
        type="button"
        class="carousel-button carousel-button-prev" 
        (click)="previousImage()"
        [attr.aria-label]="'Previous image'"
        [disabled]="photoUrls().length === 0">
        ⟨
      </button>
      <button 
        type="button"
        class="carousel-button carousel-button-next" 
        (click)="nextImage()"
        [attr.aria-label]="'Next image'"
        [disabled]="photoUrls().length === 0">
        ⟩
      </button>
      
      <div class="carousel-indicators">
        @for (dot of photoUrls(); track $index; let i = $index) {
          <button
            type="button"
            class="indicator-dot"
            [class.active]="i === currentImageIndex"
            (click)="goToImage(i)"
            [attr.aria-label]="'Go to image ' + (i + 1)"
            [attr.aria-current]="i === currentImageIndex ? 'true' : 'false'">
          </button>
        }
      </div>
      
      <div class="carousel-counter">
        {{ currentImageIndex + 1 }} / {{ photoUrls().length }}
      </div>
    }
  </div>
} @else {
  <div class="carousel-empty">
    <p>No images available</p>
  </div>
}
