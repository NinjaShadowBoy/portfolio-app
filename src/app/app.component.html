<a class="skip-link" href="#main-content" (click)="skipToMain($event)" i18n="Skip link@@skipToContent">Skip to content</a>
<app-header />
<app-breadcrumb />
<main #main id="main-content" class="main-content" tabindex="-1">
  <router-outlet />
</main>
<app-footer />
<app-notification-container />
<app-back-to-top />
<!-- The assistant rides on idle so the initial bundle and SSR output stay lean. -->
@defer (on idle) {
  <app-mascot />
  @if (chatUi.paneRequested()) {
    @defer (on immediate) {
      <app-chat-pane />
    }
  }
}
