<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title i18n="Site title@@siteTitle">Alex Abena · Software Engineering Student</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" i18n="Site meta description@@siteMetaDescription" content="Alex Abena, final-year software engineering student at Ensimag (Grenoble INP). Backend, AI and full-stack projects. Looking for a 6-month internship from January 2027.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- DNS Prefetch for external resources -->
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">

  <!-- Preconnect to critical origins -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

  <!--
    No font or image preloads: the build serves the fonts under hashed media/
    names, so a preload of assets/fonts/... is a second, unused download; and an
    image preload here runs on every page, not just home. The home photo has
    fetchpriority="high" instead.
  -->

  <!-- Critical CSS - Inline minimal styles for FCP -->
  <style>
    /* Critical above-the-fold styles */
    :root {
      --color-primary: #3572ef;
      --surface-base: #ffffff;
      --text-primary: #0f172a;
      --text-secondary: #334155;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --color-primary: #60a5fa;
        --surface-base: #0f172a;
        --text-primary: #f1f5f9;
        --text-secondary: #cbd5e1;
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--surface-base);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      margin: 0;
    }

    /* Loading skeleton for app-root */
    app-root:empty {
      display: block;
      min-height: 100vh;
      background: var(--surface-base);
    }

    app-root:empty::before {
      content: "";
      display: block;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, transparent, var(--color-primary), transparent);
      animation: loading 1.5s infinite;
    }

    @keyframes loading {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
  </style>
</head>
<body>
  <app-root></app-root>
</body>
</html>
