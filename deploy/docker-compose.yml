# Frontend stack. Deployed to /opt/portfolio-app/<env>/ on the VPS; CI copies
# this file up, then runs `docker compose pull && docker compose up -d`.
#
# The frontend holds no secrets - apiBaseUrl is compiled into the browser bundle
# at image build time - so there is no env_file here. Everything it needs is the
# image tag and the loopback port, both from .env next to this file.
#
# The port is published on 127.0.0.1 only. Host nginx terminates TLS and proxies
# to it; the container is never reachable from the internet directly.

name: portfolio-app-${DEPLOY_ENV:-production}

services:
  frontend:
    image: ${FRONTEND_IMAGE:?set FRONTEND_IMAGE in .env}
    restart: unless-stopped
    environment:
      # The SSR server reads PORT; keep it fixed inside the container and vary
      # only the host-side port, so the image is identical across environments.
      PORT: 4000
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-4000}:4000"
    healthcheck:
      # Busybox wget ships in the alpine base - no extra package for this.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      # Without a cap the SSR access log fills the disk over months.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
