name: CI

# Gate for pull requests and for pushes to branches that do NOT deploy.
# deploy.yml rebuilds the app itself, so main/staging pushes are covered
# there rather than being built twice.
on:
  pull_request:
  push:
    branches-ignore: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Matches the runtime image in the Dockerfile (node:24) - bump both
  # together. bun installs and runs scripts; ng itself runs on node.
  NODE_VERSION: "24"

jobs:
  test:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test build scripts
        run: bun run test:content && bun run test:fs-cp-retry

      # Vitest on jsdom; --watch=false (inside test:ci) exits after one run.
      - name: Test
        run: bun run test:ci

      # `bun run build` runs content:build first, which generates the
      # src/generated assets angular.json expects - running ng build alone
      # would fail. Same command the Docker build uses.
      - name: Build
        run: bun run build
