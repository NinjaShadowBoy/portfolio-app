name: CI

# Gate for pull requests and for pushes to branches that do NOT deploy.
# deploy.yml rebuilds the app inside the image, so main/staging pushes are
# covered there rather than being built twice.
on:
  pull_request:
  push:
    branches-ignore: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9"

jobs:
  test:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Karma defaults to a headed browser; ChromeHeadless is the CI equivalent.
      # --watch=false stops the runner hanging on the interactive watcher.
      - name: Test
        run: pnpm exec ng test --watch=false --browsers=ChromeHeadless

      # `pnpm build` runs content:build first, which generates the src/generated
      # assets angular.json expects - running ng build alone would fail.
      - name: Build
        run: pnpm build

  image:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only - never push from CI. Catches a broken Dockerfile on the PR
      # rather than at deploy time, and warms the layer cache for the deploy.
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: BUILD_CONFIG=production
          cache-from: type=gha
          cache-to: type=gha,mode=max
