name: CI

# Gate for pull requests and for pushes to branches that do NOT deploy.
# deploy.yml rebuilds the app itself, so main/staging pushes are covered
# there rather than being built twice.
on:
  pull_request:
  push:
    branches-ignore: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Matches the Node runtime installed on the VPS (deploy/bootstrap.sh) -
  # bump both together.
  NODE_VERSION: "24"
  PNPM_VERSION: "11"

jobs:
  test:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Karma defaults to a headed browser; ChromeHeadless is the CI equivalent.
      # --watch=false stops the runner hanging on the interactive watcher.
      - name: Test
        run: pnpm exec ng test --watch=false --browsers=ChromeHeadless

      # `pnpm build` runs content:build first, which generates the src/generated
      # assets angular.json expects - running ng build alone would fail. Same
      # command the deploy build uses, so a broken build fails here first.
      - name: Build
        run: pnpm build
