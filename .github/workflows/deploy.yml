name: Deploy Frontend

# The manual production routine, automated. Test, build the SSR image on the
# runner, `docker save | ssh | docker load` it onto the VPS, then
# .github/deploy/remote-deploy.sh backs up the DB, sets the frontend image in
# /opt/apps/portfolio/production/compose.yaml (keeping compose.yaml.bak) and
# runs `docker compose up -d --wait`. The public URLs are checked from the
# runner; if they fail, the frontend goes back to the image it replaced.
#
# The image never touches a registry, so the VPS needs no registry login
# and GHCR package visibility does not matter.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "otel/**"
      - "angular.json"
      - "package.json"
      - "bun.lock"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/deploy/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# Never run two production deploys of this repo at once. The backend repo
# edits the same compose.yaml; remote-deploy.sh holds a lock on the VPS for that.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash # -eo pipefail, so a failed `docker save | ssh` fails the step

env:
  IMAGE: ghcr.io/ninjashadowboy/portfolio-app
  SERVICE: frontend
  VPS_HOST: 51.210.177.80
  VPS_PORT: "6562"
  VPS_USER: deploy
  # Matches the runtime image in the Dockerfile (node:24). bun installs and
  # runs scripts; ng itself runs on node.
  NODE_VERSION: "24"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test build scripts
        run: bun run test:content && bun run test:fs-cp-retry

      - name: Test
        run: bun run test:ci

  deploy:
    name: Deploy to production
    needs: test
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # ci-<sha12>-<run>-<attempt>: unique per run, so a re-run never
      # re-tags the image it may need to roll back to.
      - name: Compute image tag
        run: echo "TAG=ci-${GITHUB_SHA::12}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      # The Dockerfile runs `bun run build`, so this is also the build check.
      - name: Build image
        run: |
          docker build \
            --build-arg "VERSION=$TAG" \
            --build-arg NG_CONFIGURATION=production \
            -t "$IMAGE:$TAG" .

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          printf '%s\n' \
            'Host vps' \
            "  HostName $VPS_HOST" \
            "  Port $VPS_PORT" \
            "  User $VPS_USER" \
            '  IdentityFile ~/.ssh/deploy_key' \
            '  IdentitiesOnly yes' \
            '  StrictHostKeyChecking yes' \
            '  ServerAliveInterval 30' > ~/.ssh/config
          ssh vps true

      - name: Ship image to the VPS
        run: docker save "$IMAGE:$TAG" | gzip | ssh vps 'gunzip | docker load'

      - name: Back up DB, update compose.yaml, compose up --wait
        id: deploy
        run: |
          ssh vps bash -s -- deploy "$SERVICE" "$IMAGE:$TAG" < .github/deploy/remote-deploy.sh | tee deploy.log
          echo "previous=$(sed -n 's/^PREVIOUS_IMAGE=//p' deploy.log)" >> "$GITHUB_OUTPUT"

      - name: Check public URLs
        id: verify
        run: |
          check() {
            for _ in $(seq 1 10); do
              if curl -fsS -o /dev/null --max-time 15 "$1"; then echo "OK $1"; return 0; fi
              sleep 6
            done
            echo "::error::$1 did not answer 2xx"
            return 1
          }
          ok=true
          for url in \
            https://alexabena.me \
            https://www.alexabena.me \
            https://alexabena.space; do
            check "$url" || ok=false
          done
          $ok

      - name: Roll back to the previous image
        if: failure() && steps.verify.outcome == 'failure' && steps.deploy.outputs.previous != ''
        env:
          PREVIOUS: ${{ steps.deploy.outputs.previous }}
        run: ssh vps bash -s -- rollback "$SERVICE" "$PREVIOUS" < .github/deploy/remote-deploy.sh

      - name: Summary
        if: always()
        env:
          PREVIOUS: ${{ steps.deploy.outputs.previous }}
          VERIFY: ${{ steps.verify.outcome }}
        run: |
          {
            echo "### Frontend deploy"
            echo "- image: \`$IMAGE:$TAG\`"
            echo "- replaced: \`${PREVIOUS:-n/a}\`"
            echo "- public checks: ${VERIFY:-skipped}"
          } >> "$GITHUB_STEP_SUMMARY"
