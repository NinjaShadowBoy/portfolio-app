name: Deploy Frontend

# Builds the Angular SSR bundle, scp's it to a fresh release directory on the
# VPS, then repoints the `current` symlink and restarts the systemd --user
# service. Pushing to `main` deploys production; `staging` deploys the
# staging instance.
#
# The frontend holds no secrets - apiBaseUrl is compiled into the browser
# bundle at build time - so .env on the VPS is only PORT/DEPLOY_ENV, written
# fresh each deploy.
on:
  push:
    branches: [main, staging]
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "angular.json"
      - "package.json"
      - "bun.lock"

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11"

jobs:
  build:
    name: Build SSR bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Angular SSR
        run: bun run build

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: dist/portfolio-app
          retention-days: 7

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      DEPLOY_ENV: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      - name: Deploy to VPS
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete
          path: dist/portfolio-app/
          remote_path: ${{ vars.APP_PATH }}/${{ env.DEPLOY_ENV }}/dist/
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}

      # New, self-contained directory per deploy - nothing on the box is
      # overwritten until the symlink swap below, so a failed scp never
      # leaves a half-written release live.
      - name: Copy release to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: release/dist
          target: ${{ vars.APP_PATH }}/${{ steps.vars.outputs.env }}/releases/${{ github.sha }}/
          strip_components: 1

      # One SSH session: write .env, activate the release, restart, verify,
      # prune old releases.
      - name: Deploy release
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_ENV: ${{ steps.vars.outputs.env }}
          FRONTEND_PORT: ${{ steps.vars.outputs.port }}
          RELEASE_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DEPLOY_ENV,FRONTEND_PORT,RELEASE_SHA
          script: |
            cd ${{ vars.APP_PATH }}/${{ env.DEPLOY_ENV }}
            pm2 restart ecosystem.config.js --env ${{ env.DEPLOY_ENV }} || \
            pm2 start ecosystem.config.js --env ${{ env.DEPLOY_ENV }}
            pm2 save
