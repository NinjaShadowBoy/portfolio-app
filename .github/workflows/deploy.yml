name: Deploy Frontend

# Builds the Angular SSR bundle, scp's it to a fresh release directory on the
# VPS, then repoints the `current` symlink and restarts the systemd --user
# service. Pushing to `main` deploys production; `staging` deploys the
# staging instance.
#
# The frontend holds no secrets - apiBaseUrl is compiled into the browser
# bundle at build time - so .env on the VPS is only PORT/DEPLOY_ENV, written
# fresh each deploy.
on:
  push:
    branches: [main, staging]
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "angular.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "deploy/portfolio-frontend@.service"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11"

jobs:
  build:
    name: Build SSR bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm build` runs content:build first, which generates the
      # src/generated assets angular.json expects, then `ng build` with its
      # defaultConfiguration (production).
      #
      # NOTE: staging builds with the same `production` Angular configuration
      # because there is no staging environment file yet. apiBaseUrl is
      # compiled into the browser bundle, so staging currently talks to the
      # production API. To split them: add
      # src/environments/environment.staging.ts and a `staging` configuration
      # in angular.json with a fileReplacements entry, then build with
      # `--configuration staging` on the staging branch here.
      - name: Build
        run: pnpm build

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: dist/portfolio-app
          retention-days: 7

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - name: Resolve deployment environment
        id: vars
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "env=production" >> "$GITHUB_OUTPUT"
            echo "port=4000" >> "$GITHUB_OUTPUT"
          else
            echo "env=staging" >> "$GITHUB_OUTPUT"
            echo "port=4001" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: release/dist/portfolio-app

      # New, self-contained directory per deploy - nothing on the box is
      # overwritten until the symlink swap below, so a failed scp never
      # leaves a half-written release live.
      - name: Copy release to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: release/dist
          target: ${{ vars.APP_PATH }}/${{ steps.vars.outputs.env }}/releases/${{ github.sha }}/
          strip_components: 1

      # One SSH session: write .env, activate the release, restart, verify,
      # prune old releases.
      - name: Deploy release
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_ENV: ${{ steps.vars.outputs.env }}
          FRONTEND_PORT: ${{ steps.vars.outputs.port }}
          RELEASE_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DEPLOY_ENV,FRONTEND_PORT,RELEASE_SHA
          script: |
            set -euo pipefail
            target="${{ vars.APP_PATH }}/$DEPLOY_ENV"
            cd "$target"

            # The frontend holds no secrets, so this .env is just what the
            # systemd unit needs - rewritten fresh each deploy.
            cat > .env <<ENVFILE
            DEPLOY_ENV=$DEPLOY_ENV
            NODE_ENV=production
            PORT=$FRONTEND_PORT
            ENVFILE

            ln -sfn "releases/$RELEASE_SHA" current
            systemctl --user restart "portfolio-frontend@$DEPLOY_ENV"

            # Same probe the deploy has always waited on - a process that
            # starts but never serves fails the deploy instead of passing
            # silently.
            ok=""
            for _ in $(seq 1 15); do
              if curl -fsS "http://127.0.0.1:$FRONTEND_PORT/" >/dev/null; then
                ok=1
                break
              fi
              sleep 2
            done
            if [ -z "$ok" ]; then
              echo "portfolio-frontend@$DEPLOY_ENV did not become healthy" >&2
              systemctl --user status "portfolio-frontend@$DEPLOY_ENV" --no-pager || true
              exit 1
            fi

            systemctl --user status "portfolio-frontend@$DEPLOY_ENV" --no-pager

            # Reclaim disk from superseded releases; without this the VPS
            # fills up after a few dozen deploys.
            ls -1t releases | tail -n +6 | while read -r old; do
              rm -rf "releases/$old"
            done
