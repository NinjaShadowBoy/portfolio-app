name: Deploy Frontend

# Builds the Angular SSR app into a container image, pushes it to GHCR, then
# tells the VPS to pull it and roll the compose stack. Pushing to `main` deploys
# production; `staging` deploys the staging instance.
#
# The build happens inside the image (see Dockerfile), not here - so there is
# exactly one definition of how this app is built, and CI cannot produce an
# artifact the image would not.
on:
  push:
    branches: [main, staging]
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "angular.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "Dockerfile"
      - "deploy/docker-compose.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR rejects uppercase path segments, and the owner here is mixed-case.
      - name: Resolve image reference
        id: meta
        run: |
          repo_lc="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${repo_lc}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # NOTE: staging builds with the `production` Angular configuration
          # because there is no staging environment file yet. apiBaseUrl is
          # compiled into the browser bundle, so staging currently talks to the
          # production API. To split them: add src/environments/environment.staging.ts
          # and a `staging` configuration in angular.json with a fileReplacements
          # entry, then set this to the branch-derived name.
          build-args: BUILD_CONFIG=production
          # Immutable SHA tag only. A moving `:latest` would let the VPS pull a
          # different image than the one this run built.
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve deployment environment
        id: vars
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "env=production" >> "$GITHUB_OUTPUT"
            echo "port=4000" >> "$GITHUB_OUTPUT"
          else
            echo "env=staging" >> "$GITHUB_OUTPUT"
            echo "port=4001" >> "$GITHUB_OUTPUT"
          fi

      - name: Copy compose file to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: deploy/docker-compose.yml
          target: ${{ vars.APP_PATH }}/${{ steps.vars.outputs.env }}/
          strip_components: 1

      # One SSH session: write the compose env, log in to GHCR, pull, roll,
      # verify. `--wait` blocks on the compose healthcheck, so an image that
      # starts but never serves fails the deploy instead of passing silently.
      - name: Deploy stack
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_ENV: ${{ steps.vars.outputs.env }}
          FRONTEND_PORT: ${{ steps.vars.outputs.port }}
          FRONTEND_IMAGE: ${{ needs.build.outputs.image }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DEPLOY_ENV,FRONTEND_PORT,FRONTEND_IMAGE,REGISTRY_USER,REGISTRY_TOKEN
          script: |
            set -euo pipefail
            target="${{ vars.APP_PATH }}/$DEPLOY_ENV"
            install -d -m 755 "$target"
            cd "$target"

            # The frontend holds no secrets, so this .env is purely the values
            # compose interpolates - rewritten each deploy to pin the image.
            cat > .env <<ENVFILE
            DEPLOY_ENV=$DEPLOY_ENV
            FRONTEND_IMAGE=$FRONTEND_IMAGE
            FRONTEND_PORT=$FRONTEND_PORT
            ENVFILE

            echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

            docker compose pull
            docker compose up -d --wait --remove-orphans

            docker compose ps
            # Reclaim disk from superseded images; without this the VPS fills up
            # after a few dozen deploys.
            docker image prune -f --filter "until=168h"
